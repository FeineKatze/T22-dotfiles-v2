# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/modules/monitors.conf
# source = ~/.config/hypr/modules/autostart.conf
# source = ~/.config/hypr/modules/look_and_feel.conf
# source = ~/.config/hypr/modules/input.conf
# source = ~/.config/hypr/modules/keybindings.conf
# source = ~/.config/hypr/modules/windows_workspaces.conf

###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
#$menu = rofi -show drun
$menu = fuzzel

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

env = GDK_BACKEND,wayland,x11,* #GTK Wayland
env = QT_QPA_PLATFORM,wayland;xcb #QT Wayland
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = __GL_VRR_ALLOWED,0

env = NVD_BACKEND,direct
env = MOZ_ENABLE_WAYLAND,1
env = MOZ_DISABLE_RDD_SANDBOX,1

env = HYPRSHOT_DIR,
env = XDG_PICTURES_DIR,/home/christopher/Pictures
env = XDG_SCREENSHOTS_DIR,/home/christopher/Pictures/Screenshots
env = HYPRSHOT_DIR,/home/christopher/Pictures/Screenshots

###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

xwayland {
        enabled = true
    }

source = ./modules/general.conf
source = ./modules/decoration.conf
source = ./modules/animations.conf
source = ./modules/input.conf
source = ./modules/misc.conf
source = ./modules/binds.conf
soruce = ./modules/cursor.conf

source = ./modules/monitors.conf
source = ./modules/autostart.conf
source = ./modules/look_and_feel.conf
source = ./modules/windows_workspaces.conf
