##################
### Decoration ###
##################
# https://wiki.hypr.land/Configuring/Variables/#decoration

decoration {
    rounding = 10 # Rounded corners' radius; default = 0
    rounding_power = 3 # Adjusts the curve used for rounding corners, larger is smoother; default = 2.0
    active_opacity = 1.0 # Opacity of active windows; default = 1.0
    inactive_opacity = 1.0 # Opacity of inactive windows; default = 1.0
    fullscreen_opacity = 1.0 # Opacity of fullscreen windows; default = 1.0
    dim_modal = true # Enables dimming of parent modal windows; default = true
    dim_inactive = false # Enables dimming of inactive windows; default = false
    dim_strength = 0.5 # How much inactive windows should be dimmed; default = 0.5
    dim_special = 0.2 # How much to dim the rest of the screen by when a special workspace is open; default = 0.2
    dim_around  = 0.4 # How much the dim_around window rule should dim by; default = 0.4
    screen_shader  =  # A path to a custom shader to be applied at the end of rendering; default = Empty
    border_part_of_window = true # Wether the window border should be part of the window; default = true

    ############
    ### Blur ###
    ############
    # https://wiki.hypr.land/Configuring/Variables/#blur

    blur {
        enabled = true # Enable kawase window background blur; default = true
        size = 3 # Blur size/distance; default = 8
        passes = 1 # The amount of passes to perform; default = 1
        ignore_opacity = true # Make the blur layer ignore the opacity of the window; default = true
        new_optimizations = true # Wether to enable further optimizations to the blur; default = true
        xray = false # If enabled, floating windows will ignore tiled windows in their blur; default = true
        noise = 0.0117 # How much noise to apply; default = 0.0117
        contrast = 0.8916 # Contrast modulation for blur; default = 0.8916
        brightness  = 0.8172 # Brightness modulation for blur; default = 0.8172
        vibrancy = 0.1696 # Increase saturation of blurred colors; default = 0.1696
        vibrancy_darkness = 0.0 # How strong the effect of vibrancy is on dark areas; default = 0.0
        special = false # Wether to blur behind the special workspace; default = false
        popups = false # Wether to blur popups; default = false
        popups_ignorealpha = 0.2 # If pixel opacity is below set value, will not blur; default = 0.2
        input_methods = false # Wether to blur input methods; default = false
        input_methods_ignorealpha = 0.2 # If pixel opacity is below set value, will not blur; default = 0.2
    }

    ##############
    ### Shadow ###
    ##############
    # https://wiki.hypr.land/Configuring/Variables/#shadow

    shadow {
        enabled = true # Enable drop shadows on windows; default = true
        range = 4 # Shadow range in layout px; default = 4
        render_power = 3 # In what power to render the falloff; default = 3
        sharp = false # If enabled, will make the shadows sharp; default = false
        color = rgba(1a1a1aee) # Shadow's color; default = 0xee1a1a1a #1a1a1a
        #color_inactive =  # Inactive shadow color; default = unset
        offset = 0, 0 # Shadow's rendering offset; default = 0, 0
        scale = 1.0 # Shadow's scale; default = 1.0
    }
}
