###############
### GENERAL ###
###############
# https://wiki.hypr.land/Configuring/Variables/#general

general {
    border_size = 2 # Size of the border around windows; default = 1
    gaps_in = 5 # Gaps between windows; default = 5
    gaps_out = 10 # Gaps between windows and monitor edges; default = 20
    float_gaps = 0 # Gaps between windows and monitor edges for floating windows; default = 0
    gaps_workspaces = 0 # Gaps between workspaces, default = 0
    col.inactive_border = rgba(595959aa) # Border color for inactive windows; default = 0xff444444 #444444
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg # Border color for active window; default = 0xffffffff #ffffff
    col.nogroup_border = 0xffffaaff # Inactive border color for window that cannot be added to a group; default = 0xffffaaff #ffaaff
    col.nogroup_border_active = 0xffff00ff # Active border color for window that cannot be added to a group; default = 0xffff00ff #ff00ff
    layout = dwindle # Which layout to use; default = dwindlw
    no_focus_fallback = true # If true, will not fall back to the next available window when moving focus in a direction where no window was found; default = false
    resize_on_border = false # Enables resizing windows by clicking and dragging on borders and gaps; default = false
    extend_border_grab_area = 15 # Extends the area around the border where you can click and drag on; default = 15
    hover_icon_on_border = true # Show a cursor icon when hovering over borders; default = true
    allow_tearing = false # Master switch for allowing tearing to occur; default = false
    resize_corner = 0 # Force floating windows to use a specific corner when being resized; default = 0
    modal_parent_blocking = true # Wether parent windows of modals will be interactive; default = true
    locale =  # Overrides the system locale; default = Empty

    snap {
        enabled = false # Enable snapping for floating windows; default = false
        window_gap = 10 # Minimum gap in pixels between windows before snapping; default = 10
        monitor_gap = 10 # Minimum gap in pixels between window and monitor edges before snapping; default = 10
        border_overlap = false # If true, windows snap such that only one border's worth of space between them; default = false
        respect_gaps = false # If true, snapping will respect gaps between windows; default = false
      }
}
