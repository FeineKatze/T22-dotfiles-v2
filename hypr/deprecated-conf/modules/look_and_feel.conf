#####################
### LOOK AND FEEL ###
#####################

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

scrolling {
    fullscreen_on_one_column = true # When enabled, a single column on a workspace will always span the entire screen; default = true
    column_width = 0.5 # The default width of a column, [0.1 - 1.0]; default = 0.5
    focus_fit_method = 1 # When a column is focused, what method should be used to bring it into view. 0 = center, 1 = fit; default = 1
    follow_focus = true # When a window is focused, should the layout move to bring it into view automatically; default = true
    follow_min_visible = 0.4 # When a window is focused, require that at least a given fraction of it is visible for focus to follow. Hard input will always follow. [0.0 - 1.0]; default = 0.4
    explicit_column_widths = 0.333, 0.4, 0.667, 1.0 # A comma-separated list of preconfigured widths for colresize +/-conf; default = ..
    direction = right # Direction in which new windows appear and the layout scrolls. left/right/up/down; default = right
}
