##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

workspace = 1, monitor:DP-1, persistent:true, layout:scrolling
workspace = 2, monitor:DP-1, persistent:true
workspace = 3, monitor:DP-1, persistent:true
workspace = 4, monitor:DP-1, persistent:true
workspace = 5, monitor:DP-1, persistent:true, layout:scrolling

workspace = 6, monitor:DP-2, persistent:true
workspace = 7, monitor:DP-2, persistent:true
workspace = 8, monitor:DP-2, persistent:true
workspace = 9, monitor:DP-2, persistent:true
workspace = 10, monitor:DP-2, persistent:true

workspace = 11, monitor:HDMI-A-1, persistent:true
workspace = 12, monitor:HDMI-A-1, persistent:true
workspace = 13, monitor:HDMI-A-1, persistent:true

windowrule = match:title (.*)(Discord)(.*), workspace 11
windowrule = match:title (.*)(Floorp)(.*), workspace 6
windowrule = match:title (.*)(VLC)(.*), workspace 7
windowrule = match:title (.*)(Streamlink Twitch GUI)(.*), workspace 8
windowrule = match:title (.*)(Minecraft)(.*), workspace 2
windowrule = match:title (.*)(Prism Launcher)(.*), workspace 1
windowrule {
    name = Steam
    match:title = (.*)(Steam)(.*)
    tile = on
    workspace = 3
}

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

#windowrulev2 = float, class:^(floorp)$, title:^(Picture-in-Picture)$
#windowrulev2 = pin, class:^(floorp)$, title:^(Picture-in-Picture)$

windowrule {
    name = PiP
    match:class = ^(floorp)$
    match:title = ^(Picture-in-Picture)$
    float = yes
    pin = yes
}
