# ~/.config/pipewire/pipewire.conf.d/10-virtual-sinks.conf
# Creates virtual audio channels (Wave Link-style) + virtual mic routing.
# Restart PipeWire after placing: systemctl --user restart pipewire pipewire-pulse

context.objects = [

  # ── Playback channels ────────────────────────────────────────────────────────
  { factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = "sink_game"
      node.description = "Game"
      media.class      = "Audio/Sink"
      audio.position   = [ FL FR ]
    }
  }
  { factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = "sink_music"
      node.description = "Music"
      media.class      = "Audio/Sink"
      audio.position   = [ FL FR ]
    }
  }
  { factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = "sink_chat"
      node.description = "Chat"
      media.class      = "Audio/Sink"
      audio.position   = [ FL FR ]
    }
  }
  { factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = "sink_browser"
      node.description = "Browser"
      media.class      = "Audio/Sink"
      audio.position   = [ FL FR ]
    }
  }
  { factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = "sink_system"
      node.description = "System"
      media.class      = "Audio/Sink"
      audio.position   = [ FL FR ]
    }
  }

  # ── Virtual mic channels ──────────────────────────────────────────────────────
  # Soundboard: route your soundboard app here
  { factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = "sink_soundboard"
      node.description = "Soundboard"
      media.class      = "Audio/Sink"
      audio.position   = [ FL FR ]
    }
  }
  # Virtual Mic: set this as your mic input in Discord/apps
  # (select "Virtual Mic Monitor" in Discord input settings)
  { factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = "sink_virt_mic"
      node.description = "VirtualMic"
      media.class      = "Audio/Sink"
      audio.position   = [ FL FR ]
    }
  }
]

context.modules = [

  # ── Playback channels → Real output (so you hear everything) ─────────────────

  { name = libpipewire-module-loopback
    args = {
      node.description = "Game → Output"
      capture.props = {
        node.name           = "lb.game.cap"
        target.object       = "sink_game"
        stream.capture.sink = true
      }
      playback.props = {
        node.name    = "lb.game.play"
        node.passive = true
      }
    }
  }

  { name = libpipewire-module-loopback
    args = {
      node.description = "Music → Output"
      capture.props = {
        node.name           = "lb.music.cap"
        target.object       = "sink_music"
        stream.capture.sink = true
      }
      playback.props = {
        node.name    = "lb.music.play"
        node.passive = true
      }
    }
  }

  { name = libpipewire-module-loopback
    args = {
      node.description = "Chat → Output"
      capture.props = {
        node.name           = "lb.chat.cap"
        target.object       = "sink_chat"
        stream.capture.sink = true
      }
      playback.props = {
        node.name    = "lb.chat.play"
        node.passive = true
      }
    }
  }

  { name = libpipewire-module-loopback
    args = {
      node.description = "Browser → Output"
      capture.props = {
        node.name           = "lb.browser.cap"
        target.object       = "sink_browser"
        stream.capture.sink = true
      }
      playback.props = {
        node.name    = "lb.browser.play"
        node.passive = true
      }
    }
  }

  { name = libpipewire-module-loopback
    args = {
      node.description = "System → Output"
      capture.props = {
        node.name           = "lb.system.cap"
        target.object       = "sink_system"
        stream.capture.sink = true
      }
      playback.props = {
        node.name    = "lb.system.play"
        node.passive = true
      }
    }
  }

  # ── Virtual mic routing ───────────────────────────────────────────────────────

  # Real mic → Virtual Mic (no target = default source/mic)
  { name = libpipewire-module-loopback
    args = {
      node.description = "Mic → VirtMic"
      capture.props = {
        node.name     = "lb.mic_vmic.cap"
        target.object = "easyeffects_source"
        node.passive  = true
      }
      playback.props = {
        node.name     = "lb.mic_vmic.play"
        target.object = "sink_virt_mic"
        node.passive  = true
      }
    }
  }

  # Soundboard → Virtual Mic (Discord hears soundboard)
  { name = libpipewire-module-loopback
    args = {
      node.description = "Soundboard → VirtMic"
      capture.props = {
        node.name           = "lb.sb_vmic.cap"
        target.object       = "sink_soundboard"
        stream.capture.sink = true
      }
      playback.props = {
        node.name     = "lb.sb_vmic.play"
        target.object = "sink_virt_mic"
        node.passive  = true
      }
    }
  }

  # Soundboard → Output (you hear soundboard too)
  { name = libpipewire-module-loopback
    args = {
      node.description = "Soundboard → Output"
      capture.props = {
        node.name           = "lb.sb_out.cap"
        target.object       = "sink_soundboard"
        stream.capture.sink = true
      }
      playback.props = {
        node.name    = "lb.sb_out.play"
        node.passive = true
      }
    }
  }
]
