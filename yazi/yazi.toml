# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.

[mgr]
ratio          = [ 1, 4, 3 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse 	 = false
sort_dir_first = true
sort_translit  = false
linemode       = "none"
show_hidden    = true
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click", "scroll" ]
title_format   = "Yazi: {cwd}"

[preview]
wrap            = "no"
tab_size        = 2
max_width       = 600
max_height      = 900
cache_dir       = ""
image_delay     = 30
image_filter    = "triangle"
image_quality   = 75
ueberzug_scale  = 1
ueberzug_offset = [ 0, 0, 0, 0 ]

[opener]
edit = [
	{ run = "${EDITOR:-nvim} %s", desc = "$EDITOR",      for = "unix", block = true },
]
play = [
	{ run = "xdg-open %s1",                desc = "Play", for = "linux" },
	{ run = "mediainfo %s1; echo 'Press enter to exit'; read _", block = true, desc = "Show media info", for = "unix" },
]
paplay = [
    { run = "pw-play --target 'sink_soundboard' %s1", desc = "Play Soundboard", for = "linux"},
]
open = [
	{ run = "xdg-open %s1",    desc = "Open", for = "linux" },
]
aseprite = [
    { run = "aseprite %s1", desc = "Open with aseprite", for = "linux" },
]
rotate = [
    { run = "mogrify -rotate 90 %s1", desc = "Rotate", for = "linux" }
]
reveal = [
	#{ run = "xdg-open %d1",         desc = "Reveal", for = "linux" },
]
extract = [
	{ run = "ya pub extract --list %s", desc = "Extract here" },
]
mount-zip = [
	{ run = '''
		stem="${1%.*}"
		parent_path="${stem%/*}"
		folder_name="${parent_path##*/}"
		file_stem="${stem##*/}"
		final_dir="$folder_name/$file_stem"
		mkdir -p "/tmp/Archive/$final_dir" && fuse-zip %s "/tmp/Archive/$final_dir" && ya emit cd "/tmp/Archive/$final_dir"
'''
, desc = "Mount Zip" },

	{ run = '''
		stem="${1%.*}"
		parent_path="${stem%/*}"
		folder_name="${parent_path##*/}"
		file_stem="${stem##*/}"
		final_dir="$folder_name/$file_stem"
		fusermount -u "/tmp/Archive/$final_dir" && rm -r "/tmp/Archive/$folder_name"
'''
, desc = "Unmount Zip" },
#stem=/run/media/christopher/Volume/PrismLauncher/instances/Client-1.21.11/minecraft/resourcepacks/beautiful_potions_1.21.5_1.1.0
#parent_path=/run/media/christopher/Volume/PrismLauncher/instances/Client-1.21.11/minecraft/resourcepacks
#folder_name=resourcepacks
#file_stem=beautiful_potions_1.21.5_1.1.0
#final_dir=resourcepacks/beautiful_potions_1.21.5_1.1.0

#	{ run = '''
#		stem="${1%.*}"
#		parent_path="${stem%/*}"
#		folder_name="${parent_path##*/}"
#		file_stem="${stem##*/}"
#		final_dir="$folder_name/$file_stem"
#		notify-send Dir "$final_dir"
	#'''
	#, desc = "Test Zip" },
]
download = [
	{ run = "ya emit download --open %S", desc = "Download and open" },
	{ run = "ya emit download %S",        desc = "Download" },
]

office = [
    { run = "onlyoffice-desktopeditors %s1", desc = "OnlyOffice", orphan = true},
    { run = "libreoffice %s1", desc = "LibreOffice", orphan = true},
]

audacity = [
    { run = "audacity %s1", desc = "Audacity", orphan = true},
]

[open]
rules = [
	# Folder
	{ url = "*/", use = [ "edit", "open", "reveal" ] },
	# Text
	{ mime = "text/*", use = [ "edit", "reveal" ] },
	# Image
	{ mime = "image/*", use = [ "open", "aseprite", "reveal", "rotate" ] },
	# Media
	{ mime = "{audio,video}/*", use = [ "play", "audacity", "reveal" ] },
	# Archive
	{ mime = "application/{zip,jar*,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*,java-archive,octet-stream}", use = [ "extract", "reveal", "mount-zip" ] },
	# JSON
	{ mime = "application/{json,ndjson}", use = [ "edit", "reveal" ] },
	{ mime = "*/javascript", use = [ "edit", "reveal" ] },
	# Empty file
	{ mime = "inode/empty", use = [ "edit", "reveal" ] },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", use = "download" },
	# Fallback
	{ url = "*", use = [ "open", "reveal"] },
]

prepend_rules = [
    # Documents
    { mime = "application/oasis.opendocument.*", use = [ "office" ]},
    { mime = "application/openxmlformats-officedocument.*", use = [ "office" ]},
    { mime = "application/msword", use = [ "office" ] },
    # Soundboard
    { mime = "audio/mpeg", use = [ "play", "paplay" ] },
]

[tasks]
micro_workers    = 10
macro_workers    = 10
bizarre_retry    = 3
image_alloc      = 536870912  # 512MB
image_bound      = [ 10000, 10000 ]
suppress_preload = false

[plugin]
fetchers = [
	# Mimetype
	{ id = "mime", url = "*/",         run = "mime.dir", prio = "high", group = "1"},
	{ id = "mime", url = "local://*",  run = "mime.local", prio = "high",group = "2" },
	{ id = "mime", url = "remote://*", run = "mime.remote", prio = "high", group = "3" },
]
spotters = [
	{ url = "*/", run = "folder" },
	# Code
	{ mime = "text/*", run = "code" },
	{ mime = "application/{mbox,javascript,wine-extension-ini}", run = "code" },
	# Image
	{ mime = "image/{avif,hei?,jxl}", run = "magick" },
	{ mime = "image/svg+xml", run = "svg" },
	{ mime = "image/*", run = "image" },
	# Video
	{ mime = "video/*", run = "video" },
	# Virtual file system
	{ mime = "vfs/*", run = "vfs" },
	# Error
	{ mime = "null/*", run = "null" },
	# Fallback
	{ url = "*", run = "file" },
]
preloaders = [
	# Image
	{ mime = "image/{avif,hei?,jxl}", run = "magick" },
	{ mime = "image/svg+xml", run = "svg" },
	{ mime = "image/*", run = "image" },
	# Video
	{ mime = "video/*", run = "video" },
	# PDF
	{ mime = "application/pdf", run = "pdf" },
	# Font
	{ mime = "font/*", run = "font" },
	{ mime = "application/ms-opentype", run = "font" },
]
previewers = [
	{ url = "*/", run = "folder" },
	# Code
	{ mime = "text/*", run = "code" },
	{ mime = "application/{mbox,javascript,wine-extension-ini}", run = "code" },
	# JSON
	{ mime = "application/{json,ndjson}", run = "json" },
	# Image
	{ mime = "image/{avif,hei?,jxl}", run = "magick" },
	{ mime = "image/svg+xml", run = "svg" },
	{ mime = "image/*", run = "image" },
	# Video
	{ mime = "video/*", run = "video" },
	# PDF
	{ mime = "application/pdf", run = "pdf" },
	# Archive
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", run = "archive" },
	{ mime = "application/{debian*-package,redhat-package-manager,rpm,android.package-archive}", run = "archive" },
	{ url = "*.{AppImage,appimage}", run = "archive" },
	# Virtual Disk / Disk Image
	{ mime = "application/{iso9660-image,qemu-disk,ms-wim,apple-diskimage}", run = "archive" },
	{ mime = "application/virtualbox-{vhd,vhdx}", run = "archive" },
	{ url = "*.{img,fat,ext,ext2,ext3,ext4,squashfs,ntfs,hfs,hfsx}", run = "archive" },
	# Font
	{ mime = "font/*", run = "font" },
	{ mime = "application/ms-opentype", run = "font" },
	# Empty file
	{ mime = "inode/empty", run = "empty" },
	# Virtual file system
	{ mime = "vfs/*", run = "vfs" },
	# Error
	{ mime = "null/*", run = "null" },
	# Fallback
	{ url = "*", run = "file" },
]

[input]
cursor_blink = false

# cd
cd_title  = "Change directory:"
cd_origin = "top-center"
cd_offset = [ 0, 2, 50, 3 ]

# create
create_title  = [ "Create:", "Create (dir):" ]
create_origin = "top-center"
create_offset = [ 0, 2, 50, 3 ]

# rename
rename_title  = "Rename:"
rename_origin = "hovered"
rename_offset = [ 0, 1, 50, 3 ]

# filter
filter_title  = "Filter:"
filter_origin = "top-center"
filter_offset = [ 0, 2, 50, 3 ]

# find
find_title  = [ "Find next:", "Find previous:" ]
find_origin = "top-center"
find_offset = [ 0, 2, 50, 3 ]

# search
search_title  = "Search via {n}:"
search_origin = "top-center"
search_offset = [ 0, 2, 50, 3 ]

# shell
shell_title  = [ "Shell:", "Shell (block):" ]
shell_origin = "top-center"
shell_offset = [ 0, 2, 50, 3 ]

[confirm]
# trash
trash_title 	= "Trash {n} selected file{s}?"
trash_origin	= "center"
trash_offset	= [ 0, 0, 70, 20 ]

# delete
delete_title 	= "Permanently delete {n} selected file{s}?"
delete_origin	= "center"
delete_offset	= [ 0, 0, 70, 20 ]

# overwrite
overwrite_title  = "Overwrite file?"
overwrite_body   = "Will overwrite the following file:"
overwrite_origin = "center"
overwrite_offset = [ 0, 0, 50, 15 ]

# quit
quit_title  = "Quit?"
quit_body   = "The following tasks are still running, are you sure you want to quit?"
quit_origin = "center"
quit_offset = [ 0, 0, 50, 15 ]

[pick]
open_title  = "Open with:"
open_origin = "hovered"
open_offset = [ 0, 1, 50, 7 ]

[which]
sort_by      	 = "none"
sort_sensitive = false
sort_reverse 	 = false
sort_translit  = false
